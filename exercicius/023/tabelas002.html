<!DOCTYPE html>
<html lang="pt-br">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1.0">
      <title>Tabelas</title>
      <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
        }
        td, th {
            border: 1px solid black;
            padding: 10px;
        }
        thead, tfoot {
            background-color: gray;
            color: white;
        }
        .num {
            text-align: right;
        }
      </style>
    </head>
    <body>
        <h1>Uso de tabelas grandes</h1>
        <table>
            <thead>
             <tr>
                <th>Estado</th>
                <th>População</th>
             </tr>
            </thead>
            <tbody>
             <tr>
                <td>São paulo</td>
                <td class="num">45.919.049</td>
             </tr>
             <tr>
                <td>Minas gerais</td>
                <td class="num">21.168.791</td>
             </tr>
             <tr>
                <td>Rio de janeiro</td>
                <td class="num">17.264.943</td>
             </tr>
             <tr>
                <td>Bahia</td>
                <td class="num">14.870.907</td>
             </tr>
             <tr>
                <td>Paraná</td>
                <td class="num">11.890.517</td>
             </tr>
             <tr>
                <td>Rio grande do sul</td>
                <td class="num">11.233.263</td>
             </tr>
             <tr>
                <td>Pernanbuco</td>
                <td class="num">9.562.007</td>
             </tr>
             <tr>
                <td>Ceará</td>
                <td class="num">9.268.836</td>
             </tr>
             <tr>
                <td>Pará</td>
                <td class="num">8.711.196</td>
             </tr>
             <tr>
                <td>Santa catarina</td>
                <td class="num">8.187.029</td>
             </tr>
            </tbody>
            <tfoot>
             <tr>
                <th>Total de habitantes</th>
                <td><strong>210.147.125</strong></td>
             </tr>
            </tfoot>
        </table>
    </body>
</html>
